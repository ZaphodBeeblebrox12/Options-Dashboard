name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-policy-tests:
    name: Frontend replay and freshness regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test replay and live-status policies
        run: node --test frontend/tests/*.test.mjs

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node.js 22.23.4 includes the fix for CVE-2026-111497.
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Check installed Python Brotli decoders
        run: |
          python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          from packaging.version import Version

          minimums = {
              "Brotli": "1.2.1",
              "brotlicffi": "1.2.1.0",
          }
          installed = 0
          for distribution, minimum in minimums.items():
              try:
                  actual = Version(version(distribution))
              except PackageNotFoundError:
                  continue
              installed += 1
              if actual < Version(minimum):
                  raise SystemExit(
                      f"{distribution} {actual} is vulnerable to CVE-2026-111497; "
                      f"upgrade to >= {minimum}"
                  )
              print(f"{distribution} {actual}: patched")

          if not installed:
              print("No Python Brotli decoder distributions installed.")
          PY

      - name: Compile backend and maintenance scripts
        run: python -m compileall -q backend tools

      - name: Run backend unit tests
        run: python -m pytest -q backend/tests
