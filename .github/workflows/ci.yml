name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Temporary lockfile repair step: the checked-in package lock was
      # already out of sync with package.json, which makes npm ci fail before
      # typechecking can run. The generated lockfile is uploaded so it can be
      # committed, then this step is removed and npm ci remains the gate.
      - name: Regenerate frontend lockfile from manifest
        working-directory: frontend
        run: npm install --package-lock-only

      - name: Upload regenerated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
      - name: Test replay and live-status policies
        working-directory: frontend
        run: node --test tests/*.test.mjs

  backend:
    name: Backend compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Compile backend and maintenance scripts
        run: python -m compileall -q backend tools

      - name: Run backend unit tests
        run: python -m pytest -q backend/tests
