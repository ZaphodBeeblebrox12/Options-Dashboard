name: One-time frontend lockfile repair

on:
  push:
    branches:
      - fix/p1-live-replay-freshness
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  regenerate-and-commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile from package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized; no commit needed."
            exit 0
          fi
          git commit -m "Fix frontend package lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
